# Build the wiki, check it, and optionally publish it.
#
# Reusable rather than copied, because two workflows need it — an ordinary push
# and the scheduled manifest refresh — and a build recipe kept in two files is
# a build recipe that will one day differ between them. This family has lost
# days to exactly that shape of mistake.
#
# The link check is a gate, not a report. A wiki whose internal links rot is
# worse than one that is a day out of date, and this is the only thing that
# would notice.
name: Publish

on:
  workflow_call:
    inputs:
      deploy:
        description: Publish to Firebase Hosting, rather than only building.
        type: boolean
        default: false
      ref:
        description: What to build. Empty means whatever triggered the run.
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    # The run's OIDC token is what the deploy signs in to Google with. A caller
    # must grant id-token: write too; a called workflow cannot exceed it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The scheduled refresh commits to main and then publishes, so it has
          # to ask for main rather than the commit that started the run — which
          # is the one *before* the manifest landed.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `build` regenerates the per-plugin changelog pages from the manifest
      # first, so a manifest change becomes pages without anyone remembering.
      - run: npm run build

      - name: Check internal links
        run: node tools/check-links.mjs

      # No key exists: the deploy trades this run's OIDC token for short-lived
      # Google credentials as github-deploy@kovatidev (website repo,
      # tools/setup-ci.sh). Google accepts the token only from main.
      - name: Google credentials configured
        if: inputs.deploy
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          # Silence here is how the website repo published nothing for six
          # weeks while every run went green. A run that reports success for
          # work it did not do is worse than a red one.
          if [ -z "$PROVIDER" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER or GCP_SERVICE_ACCOUNT is not set, so nothing was published."
            echo "Set both as repository variables; the website repo's tools/setup-ci.sh prints their values."
            exit 1
          fi

      - uses: google-github-actions/auth@v3
        if: inputs.deploy
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        if: inputs.deploy
        run: |
          set -euo pipefail
          # The auth step exported GOOGLE_APPLICATION_CREDENTIALS for this.
          npx --yes firebase-tools@latest deploy --only hosting:docs             --project kovatidev --non-interactive --force
